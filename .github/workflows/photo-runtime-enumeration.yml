name: Photo runtime enumeration
on:
  push:
    paths:
      - '.github/workflows/photo-runtime-enumeration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  enumerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run canonical photo enumerator
        run: node tests/photo-runtime-enumeration.mjs | tee photo-runtime-enumeration.json
      - uses: actions/upload-artifact@v4
        with:
          name: photo-runtime-enumeration
          path: photo-runtime-enumeration.json
